name: pi-agent
services:
  pi-agent:
    image: pi-agent-base
    build:
      context: ./image
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    working_dir: ${WORKDIR}
    tty: true
    init: true
    network_mode: "service:dind"
    environment:
      HOME: ${AGENT_HOME}
      PATH: ${AGENT_HOME}/dotfiles/bin:/usr/local/go/bin:/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
      TZ: Europe/Moscow
      HERDR_ENV: "1"
      HERDR_PANE_ID: ${HERDR_PANE_ID:-}
      HERDR_TAB_ID: ${HERDR_TAB_ID:-}
      HERDR_WORKSPACE_ID: ${HERDR_WORKSPACE_ID:-}
      HERDR_SOCKET_PATH: ${AGENT_HOME}/.config/herdr/herdr.sock
      HERDR_AGENT: ${HERDR_AGENT:-pi}
      DOCKER_HOST: unix:///var/run/dind/docker.sock
      DOCKER_CONFIG: ${AGENT_HOME}/.cache/docker
      UV_PYTHON_INSTALL_DIR: ${AGENT_HOME}/.cache/uv-python
      UV_TOOL_DIR: ${AGENT_HOME}/.cache/uv-tools
    volumes:
      - ${AGENT_HOME}/projects:${AGENT_HOME}/projects
      - ${AGENT_HOME}/tmp/pi-cache/brain:${AGENT_HOME}/.pi/agent
      - ${AGENT_HOME}/tmp/pi-cache/pi-runtime:${AGENT_HOME}/.pi/runtime:ro
      - ${AGENT_HOME}/.pi/agent/sessions:${AGENT_HOME}/.pi/agent/sessions
      - ${AGENT_HOME}/.pi/agent/missions:${AGENT_HOME}/.pi/agent/missions
      - ${AGENT_HOME}/vaults/work/researches:${AGENT_HOME}/vaults/work/researches
      - ${AGENT_HOME}/vaults/work/incidents:${AGENT_HOME}/vaults/work/incidents
      - ${AGENT_HOME}/tmp/pi-cache/dotfiles:${AGENT_HOME}/dotfiles
      - ${AGENT_HOME}/tmp/pi-cache/gitconfig:${AGENT_HOME}/.gitconfig
      - ${AGENT_HOME}/tmp/pi-cache/credentials:${AGENT_HOME}/credentials
      - ${AGENT_HOME}/tmp/pi-cache/nvim:${AGENT_HOME}/.config/nvim
      - gomodcache:/go/pkg/mod
      - gocache:/tmp/gocache
      - npm:${AGENT_HOME}/.npm
      - xdg-config:${AGENT_HOME}/.config
      - dot-cache:${AGENT_HOME}/.cache
      - nvim-data:${AGENT_HOME}/.local/share/nvim
      - nvim-state:${AGENT_HOME}/.local/state/nvim
      - whisper:${AGENT_HOME}/.local/share/whisper
      - ${AGENT_HOME}/tmp/pi-cache/git-credentials:/run/secrets/pi-git-credentials:ro
      - ${AGENT_HOME}/tmp/pi-cache/herdr-bridge:${AGENT_HOME}/.config/herdr
      - outer-dind:/var/run/dind

  dind:
    image: docker@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
    command: dockerd --host=unix:///var/run/docker.sock --group=${AGENT_GID:-1000} --data-root=/var/lib/docker
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - dind-data:/var/lib/docker
      - outer-dind:/var/run
      - ${AGENT_HOME}/projects:${AGENT_HOME}/projects
      - ${AGENT_HOME}/vaults/work/researches:${AGENT_HOME}/vaults/work/researches
      - ${AGENT_HOME}/vaults/work/incidents:${AGENT_HOME}/vaults/work/incidents
    mem_limit: 4g
    networks:
      - pinet
    ports:
      - "127.0.0.1:8600-8699:8600-8699"

networks:
  pinet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  outer-dind:
  dind-data:
  gomodcache:
  gocache:
  npm:
  xdg-config:
  dot-cache:
  nvim-data:
  nvim-state:
  whisper:
